<?xml version="1.0" encoding="utf-8"?>
<!-- Py8n brand mark: the "8" drawn as a workflow loop, bound by an amber node -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Py8n">
  <title>Py8n</title>
  <defs>
    <linearGradient id="py8n-tile" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F97316"/>
      <stop offset="1" stop-color="#F43F5E"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#py8n-tile)"/>
  <rect width="64" height="64" rx="14" fill="#ffffff" opacity="0.04"/>
  <circle cx="32" cy="20.5" r="11.5" stroke="#ffffff" stroke-width="6.5" fill="none"/>
  <circle cx="32" cy="43.5" r="11.5" stroke="#ffffff" stroke-width="6.5" fill="none"/>
  <circle cx="32" cy="32" r="4" fill="#FCD34D"/>
</svg>
