# Py8n - production cluster
#
#   Nuxt 3 frontend  ──►  Caddy (single entrypoint, XTransformPort routing)
#   FastAPI api      ──►  PostgreSQL   ──►  shared volume
#   Celery workers   ──►  Redis (broker + events pub/sub)
#
# Usage:
#   docker compose up --build
#   → open http://localhost:8025  (Py8n UI)
#
# The same Caddyfile contract as the sandbox is reused: requests carrying
# ?XTransformPort=<port> are proxied to that service port, everything else
# goes to the Nuxt frontend.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: py8n
      POSTGRES_PASSWORD: py8n_secret
      POSTGRES_DB: py8n
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U py8n"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot migration runner (see migrations/bootstrap.py): applies/stamps
  # the schema against Postgres, then exits. api and worker both wait for it
  # to finish successfully so neither races the other to migrate, and
  # neither ever queries a table a still-pending migration hasn't made yet.
  migrate:
    build: ./mini-services/api-backend
    command: python -m migrations.bootstrap
    restart: "no"
    environment:
      PY8N_DATABASE_URL: postgresql+asyncpg://py8n:py8n_secret@postgres:5432/py8n
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./mini-services/api-backend
    environment:
      PY8N_DEBUG: "false"
      PY8N_EXECUTION_MODE: celery
      PY8N_DATABASE_URL: postgresql+asyncpg://py8n:py8n_secret@postgres:5432/py8n
      PY8N_REDIS_URL: redis://redis:6379/0
      PY8N_LLM_BRIDGE_URL: http://llm-bridge:3010
      PY8N_PUBLIC_BASE_URL: http://localhost:8025
      # v37: flip to "true" to force sign-in (first registered account becomes
      # admin and claims all pre-existing resources)
      PY8N_REQUIRE_AUTH: "false"
    volumes:
      # Bug fix: api and worker each auto-generate a Fernet/JWT key at
      # /app/data/*.key the first time nothing is configured (see
      # services/crypto.py). Without a shared, persistent mount there, EVERY
      # rebuild silently rotated the key and made every stored credential
      # permanently undecryptable (list_credentials then 500s for everyone),
      # and api/worker could each mint a DIFFERENT key from first boot since
      # they are separate containers - breaking credential-using node
      # executions even without a rebuild. One named volume shared by both
      # services fixes both failure modes.
      - appdata:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build: ./mini-services/api-backend
    # No venv is baked into the image (the Dockerfile installs straight into
    # the image's system Python) - plain `celery` is what's actually on PATH.
    command: celery -A app.worker worker --loglevel=info --concurrency=4
    environment:
      PY8N_DEBUG: "false"
      PY8N_EXECUTION_MODE: celery
      PY8N_DATABASE_URL: postgresql+asyncpg://py8n:py8n_secret@postgres:5432/py8n
      PY8N_REDIS_URL: redis://redis:6379/0
      PY8N_LLM_BRIDGE_URL: http://llm-bridge:3010
    volumes:
      - appdata:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  llm-bridge:
    build: ./mini-services/llm-bridge
    environment:
      LLM_BRIDGE_PORT: "3010"
    # In self-hosted deployments without platform AI credentials the bridge
    # stays unused - the LLM node then runs against your own
    # OpenAI-compatible credentials from the encrypted vault.

  frontend:
    build: .
    environment:
      NUXT_PUBLIC_GATEWAY_MODE: gateway
      NUXT_PUBLIC_API_PORT: "8000"
      # Bug fix: server/routes/api/v1/[...path].ts (the Nitro fallback proxy
      # used when NOT running behind the Caddy gateway) defaults
      # PY8N_API_ORIGIN to http://127.0.0.1:8000 - correct only when Nitro
      # and the API share a process/network. Under docker-compose,
      # 127.0.0.1 inside the frontend container is the frontend container
      # itself (nothing listens on 8000 there), so any request that reaches
      # this route 502s. We run in gateway mode so Caddy normally intercepts
      # every ?XTransformPort= request before it gets here - but a request
      # that reaches frontend:3000 directly (no query param: a bare /api/v1
      # URL, a health check, a future SSR call) falls through to this proxy
      # and needs a real address, same as the Caddyfile's `api:{port}` fix.
      PY8N_API_ORIGIN: http://api:8000
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    ports:
      # Bug fix: the Caddyfile's platform block (the one that reverse-proxies
      # to Nuxt/the API - everything the README's "open http://localhost:8025"
      # actually means) explicitly listens on container port 81, NOT 80 -
      # port 80 is where the separate tenant-routing block sits (bound there
      # by Caddy's default HTTP/HTTPS ports since it declares no port of its
      # own). Mapping the host port to 80 forwarded to the WRONG block; the
      # platform was never reachable through this entrypoint at all.
      - "8025:81"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # v104 tenant routing - EITHER switch works, no setup needed by default:
      #   a) the derived route sheet: save
      #      GET /api/v1/systems/deployment/routes.caddy
      #      into ./caddy-tenants/ and unmount the line below; Caddy's glob
      #      import skips it silently while the directory is empty/missing.
      # - ./caddy-tenants:/etc/caddy/tenants:ro
      #   b) the static list (comma-separated Caddy site addresses):
      # environment:
      #   PY8N_TENANT_HOSTS: "ops.acme.com, *.acme.io"
    depends_on:
      - frontend
      - api

volumes:
  pgdata:
  appdata:
